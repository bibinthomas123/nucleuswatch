name: Weekly digest

# Every Monday: search the last 7 days, commit the small JSON/CSV record to
# digest/, and publish the web page (with plots and stamps) to GitHub Pages.
#
# One-time setup:
#   Settings -> Pages -> Source: "GitHub Actions"
#   Settings -> Secrets and variables -> Actions -> New repository secret
#     LASAIR_TOKEN  (optional; without it Lasair is skipped)
#     NUCLEUSWATCH_WEBHOOK  (optional; Slack or Discord incoming-webhook URL
#       that gets this week's TDE-like candidates)

on:
  schedule:
    - cron: "0 6 * * 1"
  # Rebuild the page when the code that produces it changes, so the site
  # never lags behind main. (The bot's own digest commits don't trigger this.)
  push:
    branches: [main]
    paths:
      - "src/nucleuswatch/**"
      - ".github/workflows/weekly.yml"
  workflow_dispatch:
    inputs:
      days:
        description: "Look-back window in days"
        default: "7"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: weekly-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    # A normal run takes ~2 minutes; never let a stuck broker request hang it.
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e ".[plot]"

      - name: Build digest and site
        env:
          LASAIR_TOKEN: ${{ secrets.LASAIR_TOKEN }}
        run: nucleuswatch digest --days "${{ github.event.inputs.days || '7' }}" --data digest --site _site

      - name: Check earlier picks against new spectra
        # A broker outage here must not block the weekly page.
        continue-on-error: true
        run: python validation/prospective.py

      - name: Commit the record
        # main may have moved while this run was building (another push, or an
        # earlier queued run committing its record), so rebase before pushing
        # and retry. On a clash in the same record, this run's copy wins
        # ("theirs" is the commit being replayed during a rebase).
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digest/ validation/prospective.json validation/PROSPECTIVE.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "digest: $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && exit 0
            echo "push rejected (attempt $attempt); retrying"
            sleep $((attempt * 5))
          done
          exit 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Post TDE-like candidates to chat
        # Only scheduled runs post, so code pushes don't re-announce a week.
        # Without the secret, notify only prints the message.
        if: github.event_name == 'schedule'
        env:
          NUCLEUSWATCH_WEBHOOK: ${{ secrets.NUCLEUSWATCH_WEBHOOK }}
        run: nucleuswatch notify --data digest
