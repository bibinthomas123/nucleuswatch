name: Publish to PyPI

# Runs when a GitHub release is published. Uses PyPI trusted publishing, so
# no API token is stored in GitHub.
#
# One-time setup on https://pypi.org/manage/account/publishing/ ("Add a new
# pending publisher"):
#   PyPI project name: nucleuswatch
#   Owner:             bibinthomas123
#   Repository:        nucleuswatch
#   Workflow:          release.yml
#   Environment:       pypi

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Check the tag matches the package version
        if: github.event_name == 'release'
        run: |
          version=$(python -c "import re;print(re.search(r'__version__ = \"(.+)\"', open('src/nucleuswatch/__init__.py').read())[1])")
          test "v$version" = "${{ github.event.release.tag_name }}" || {
            echo "tag ${{ github.event.release.tag_name }} != package version v$version"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/nucleuswatch
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
